name: Build AimBot APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
          mkdir -p $HOME/sdk/cmdline-tools
          unzip -q /tmp/cmd.zip -d /tmp/cmd
          mv /tmp/cmd/cmdline-tools $HOME/sdk/cmdline-tools/latest
          yes | $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/sdk --licenses > /dev/null 2>&1
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/sdk "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$HOME/sdk" > local.properties
          echo "ANDROID_HOME=$HOME/sdk" >> $GITHUB_ENV

      - name: Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle-dist
          GRADLE_BIN=$(find /opt/gradle-dist -name "gradle" -type f | head -1)
          echo "Found gradle at: $GRADLE_BIN"
          $GRADLE_BIN wrapper --gradle-version=8.6
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: aimbot-apk
          path: app/build/outputs/apk/debug/app-debug.apk
